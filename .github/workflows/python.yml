name: Python CPU and site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python 3.12 / ${{ matrix.os }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-2022
            arch: x64
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.2'
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --locked --group dev --python 3.12
      - name: Verify requested CPU architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          uv run python -c "import os,platform;
          actual=platform.machine().lower(); expected=os.environ['EXPECTED_ARCH'];
          print(platform.platform(), actual);
          assert actual in ({'x64': ('x86_64','amd64'), 'arm64': ('arm64','aarch64')}[expected])"
      - name: Build Python distribution
        run: uv build
      - name: CPU equations, runtime, records and offline analyses
        env:
          BRAINLESSLAB_TEST_WHEEL: ${{ github.workspace }}/dist/brainlesslab-0.4.0-py3-none-any.whl
        run: uv run pytest -m "not metal"
      - name: Lint
        run: uv run ruff check python
      - name: Check formatting
        run: uv run ruff format --check python
      - name: Type check
        run: uv run pyright

  site:
    name: Recorded replay UI and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun test
        working-directory: site
      - run: bun run typecheck
        working-directory: site
      - run: bun run build
        working-directory: site
