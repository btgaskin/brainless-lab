name: Historical Julia conformance

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Historical Julia source revision (never the active Python branch)
        required: true
        default: d0fc756d
        type: string

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Require the historical implementation
        run: test -f Project.toml && test -f src/BrainlessLab.jl
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: false
      - name: Run historical conformance at its own source boundary
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
