name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.suite }} / Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            os: ubuntu-22.04
            julia-version: '1.10.11'
          - suite: core
            os: ubuntu-22.04
            julia-version: '1'
          - suite: core
            os: macos-14
            julia-version: '1.10.11'
          - suite: core
            os: windows-2022
            julia-version: '1.10.11'
          - suite: runtime
            os: ubuntu-22.04
            julia-version: '1.10.11'
          - suite: operations
            os: ubuntu-22.04
            julia-version: '1.10.11'
          - suite: oracle
            os: ubuntu-22.04
            julia-version: '1.10.11'
    env:
      BRAINLESSLAB_TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Read the resolved Julia version
        id: julia
        run: julia -e 'open(ENV["GITHUB_OUTPUT"], "a") do io; println(io, "version=", VERSION); end'
      - name: Cache exact suite proof
        id: proof
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-proof
          key: >-
            proof-${{ runner.os }}-julia-${{ steps.julia.outputs.version }}-${{
            matrix.suite }}-${{ hashFiles('.github/workflows/ci.yml', 'Project.toml',
            'Manifest.toml', 'src/**', 'ext/**', 'test/**', 'plans/**', 'configs/**',
            'examples/**') }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        if: steps.proof.outputs.cache-hit != 'true'
        with:
          delete-old-caches: false
      - name: Instantiate the pinned environment
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run the ${{ matrix.suite }} suite
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Mark the exact suite inputs as proven
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia -e 'mkpath(".ci-proof"); write(joinpath(".ci-proof", "passed"), "passed\n")'

  legacy:
    name: Legacy / Julia 1.10.11 / Ubuntu
    if: >-
      github.event_name == 'push' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      BRAINLESSLAB_TEST_SUITE: legacy
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10.11'
      - name: Read the resolved Julia version
        id: julia
        run: julia -e 'open(ENV["GITHUB_OUTPUT"], "a") do io; println(io, "version=", VERSION); end'
      - name: Cache exact legacy proof
        id: proof
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-proof
          key: >-
            proof-${{ runner.os }}-julia-${{ steps.julia.outputs.version }}-legacy-${{
            hashFiles('.github/workflows/ci.yml', 'Project.toml', 'Manifest.toml',
            'src/**', 'ext/**', 'test/**', 'plans/**', 'configs/**', 'examples/**') }}
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        if: steps.proof.outputs.cache-hit != 'true'
        with:
          delete-old-caches: false
      - name: Instantiate the pinned environment
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run the legacy suite
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Mark the exact legacy inputs as proven
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia -e 'mkpath(".ci-proof"); write(joinpath(".ci-proof", "passed"), "passed\n")'

  visual:
    name: Visual / Julia 1.10.11 / Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10.11'
      - name: Read the resolved Julia version
        id: julia
        run: julia -e 'open(ENV["GITHUB_OUTPUT"], "a") do io; println(io, "version=", VERSION); end'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: false
      - name: Instantiate the visual environment
        run: >-
          julia --project=test/visual -e
          'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate(); Pkg.precompile()'
      - name: Cache proof for the exact visual environment
        id: proof
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-proof
          key: >-
            proof-${{ runner.os }}-julia-${{ steps.julia.outputs.version }}-visual-${{
            hashFiles('.github/workflows/ci.yml', 'Project.toml', 'Manifest.toml',
            'src/**', 'ext/**', 'test/fixtures/**', 'test/test_viz.jl',
            'test/test_examples.jl', 'test/visual/**', 'examples/**') }}
      - name: Run visual tests
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia --project=test/visual test/visual/runtests.jl
      - name: Mark the exact visual inputs as proven
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia -e 'mkpath(".ci-proof"); write(joinpath(".ci-proof", "passed"), "passed\n")'

  manifest-free-core:
    name: Manifest-free core / Julia 1.10.11 / Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      BRAINLESSLAB_TEST_SUITE: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10.11'
      - name: Read the resolved Julia version
        id: julia
        run: julia -e 'open(ENV["GITHUB_OUTPUT"], "a") do io; println(io, "version=", VERSION); end'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: false
      - name: Resolve without the checked-in manifest
        run: julia --project=. -e 'using Pkg; rm("Manifest.toml"; force=true); Pkg.instantiate(); Pkg.precompile()'
      - name: Cache proof for the exact resolved environment
        id: proof
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-proof
          key: >-
            proof-${{ runner.os }}-julia-${{ steps.julia.outputs.version }}-manifest-free-core-${{
            hashFiles('.github/workflows/ci.yml', 'Project.toml', 'Manifest.toml',
            'src/**', 'ext/**', 'test/**', 'plans/**', 'configs/**', 'examples/**') }}
      - name: Run the core suite against the resolved environment
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Mark the resolved environment as proven
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia -e 'mkpath(".ci-proof"); write(joinpath(".ci-proof", "passed"), "passed\n")'

  tool-smoke:
    name: CLI and template smoke / Julia 1.10.11 / Ubuntu
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      BRAINLESSLAB_AUTOTHREADS: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
        with:
          version: '1.10.11'
      - name: Read the resolved Julia version
        id: julia
        run: julia -e 'open(ENV["GITHUB_OUTPUT"], "a") do io; println(io, "version=", VERSION); end'
      - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
        with:
          delete-old-caches: false
      - name: Instantiate the package and template environments
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
          julia --project=examples/templates/new_project -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Cache proof for the exact tool environments
        id: proof
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-proof
          key: >-
            proof-${{ runner.os }}-julia-${{ steps.julia.outputs.version }}-tool-smoke-${{
            hashFiles('.github/workflows/ci.yml', 'Project.toml', 'Manifest.toml',
            'src/**', 'ext/**', 'bin/**', 'plans/**', 'configs/**', 'examples/**') }}
      - name: Check the CLI and example plans
        if: steps.proof.outputs.cache-hit != 'true'
        run: |
          julia --project=. bin/brainlesslab.jl check plans/examples/profile_tracking.toml
          julia --project=. bin/brainlesslab.jl check plans/examples/sweep_tracking.toml
          julia --project=. bin/brainlesslab.jl check plans/examples/ablate_tracking.toml
          julia --project=. bin/brainlesslab.jl check plans/examples/benchmark_core.toml
      - name: Instantiate and execute the project template
        if: steps.proof.outputs.cache-hit != 'true'
        run: >-
          julia --project=examples/templates/new_project
          examples/templates/new_project/run.jl --ticks 20 --n-nodes 12
          --out "${{ runner.temp }}/brainlesslab-template-smoke"
      - name: Mark the exact tool inputs as proven
        if: steps.proof.outputs.cache-hit != 'true'
        run: julia -e 'mkpath(".ci-proof"); write(joinpath(".ci-proof", "passed"), "passed\n")'

  documentation:
    name: Locked documentation build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Cache exact documentation proof
        id: proof
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .ci-proof
          key: >-
            proof-${{ runner.os }}-bun-1.3.11-documentation-${{
            hashFiles('.github/workflows/ci.yml', 'site/package.json', 'site/bun.lock',
            'site/astro.config.mjs', 'site/tsconfig.json', 'site/src/**', 'site/public/**',
            'src/**', 'ext/**', 'benchmarks/**', 'experiments/**', 'plans/**',
            'examples/**') }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.proof.outputs.cache-hit != 'true'
        with:
          bun-version: 1.3.11
      - name: Install locked documentation dependencies
        if: steps.proof.outputs.cache-hit != 'true'
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build the documentation
        if: steps.proof.outputs.cache-hit != 'true'
        working-directory: site
        run: bun run build
      - name: Mark the exact documentation inputs as proven
        if: steps.proof.outputs.cache-hit != 'true'
        run: mkdir -p .ci-proof && printf 'passed\n' > .ci-proof/passed
