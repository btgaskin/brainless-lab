    n_nodes = 200
    node = "falandays"
    task = "temporal_order"

        [targets.composition.interface]
        input_gain = 1.0

        [targets.composition.parameters]
        input_weight = 1.875
        leak = 0.25
        learn_on = true
        link_p = 0.1
        lrate_targ = 0.01
        lrate_wmat = 1.0
        rectify = false
        recurrent_init_scale = 0.1
        repair_masks = false
        targ_min = 1.0
        threshold_mult = 2.0
        topology = "bernoulli"
        weight_init_mode = "excitatory"
