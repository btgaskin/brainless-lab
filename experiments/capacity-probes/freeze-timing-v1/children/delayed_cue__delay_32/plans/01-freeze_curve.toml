format = "brainlesslab-plan"
format_version = 3
id = "freeze_curve"
operation = "benchmark"

[[benchmark.cases]]
baseline = "s1_continuous"
conditions = ["s1_continuous", "s1_freeze_weights_after_0", "s1_freeze_weights_after_10", "s1_freeze_weights_after_20", "s1_freeze_weights_after_30", "s1_freeze_weights_after_40", "s1_freeze_plasticity_after_0", "s1_freeze_plasticity_after_10", "s1_freeze_plasticity_after_20", "s1_freeze_plasticity_after_30", "s1_freeze_plasticity_after_40"]
id = "scale_1"

[[targets]]
id = "s1_continuous"
topology_key = "falandays_direct_v1"

    [targets.composition]
    id = "s1_continuous"
    n_nodes = 200
    node = "falandays"
    task = "delayed_cue"

        [targets.composition.interface]
        input_gain = 1.0

        [targets.composition.parameters]
        input_weight = 1.875
        leak = 0.25
        learn_on = true
        link_p = 0.1
        lrate_targ = 0.01
        lrate_wmat = 1.0
        rectify = false
        recurrent_init_scale = 0.1
        repair_masks = false
        targ_min = 1.0
        threshold_mult = 2.0
        topology = "bernoulli"
        weight_init_mode = "excitatory"
        weight_init_std = 1.0

        [targets.composition.task_options]
        cue_mode = "transient"
        cue_ticks = 8
        delays = [32]
        response_ticks = 8

    [targets.evaluation]
    aggregate = "mean"
    blocks = 10
    construction_scope = "block"
    horizon = 48
    reset = "full"
    root_seed = 0x78c42bd9
    streams = ["topology", "world"]
    trials_per_block = 16
    warmup = 0
