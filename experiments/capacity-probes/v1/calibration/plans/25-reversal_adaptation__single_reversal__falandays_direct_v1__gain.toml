format = "brainlesslab-plan"
format_version = 3
id = "reversal_adaptation__single_reversal__falandays_direct_v1__gain"
operation = "sweep"

[sweep]
max_rollouts = 10000
mode = "factorial"
target = "reversal_adaptation__single_reversal__falandays_direct_v1__calibration"

    [[sweep.axes]]
