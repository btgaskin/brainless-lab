[[targets]]
id = "tracking__falandays_direct_v1"
topology_key = "falandays_direct_v1"

    [targets.composition]
    id = "tracking__falandays_direct_v1"
    n_nodes = 200
    node = "falandays"
    task = "tracking"

        [targets.composition.interface]
        input_gain = 1.0

        [targets.composition.parameters]
        input_weight = 1.875
        leak = 0.25
        learn_on = true
        link_p = 0.1
        lrate_targ = 0.01
        lrate_wmat = 1.0
        rectify = false
        repair_masks = false
        targ_min = 1.0
        threshold_mult = 2.0
        topology = "bernoulli"
        weight_init_mode = "excitatory"
        weight_init_std = 1.0

    [targets.evaluation]
    aggregate = "mean"
    blocks = 32
    construction_scope = "trial"
    horizon = 7200
    reset = "full"
    root_seed = 0x013c69
    streams = ["topology", "world"]
    trials_per_block = 1
    warmup = 1200
