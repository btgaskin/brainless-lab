format = "brainlesslab-plan"
format_version = 3
id = "direct_control__v1"
operation = "benchmark"

[[benchmark.cases]]
baseline = "tracking__falandays_direct_v1"
conditions = ["tracking__falandays_direct_v1", "tracking__sorn_direct_v1"]
id = "tracking"
[[benchmark.cases]]
baseline = "pong__falandays_direct_v1"
