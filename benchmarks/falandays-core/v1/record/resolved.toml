format = "brainlesslab-resolution"
format_version = 1
id = "falandays_core_v1"
operation = "benchmark"
result_type = "BenchmarkResult"

[[operation_settings.cases]]
conditions = ["tracking_falandays"]
id = "tracking"
[[operation_settings.cases]]
conditions = ["pong_falandays"]
id = "pong"

[[targets]]
composition_id = "tracking_falandays"
id = "tracking_falandays"
n_nodes = 200
node = "falandays"
task = "tracking"

    [targets.body_options]

    [targets.evaluation]
    aggregate = "mean"
    blocks = 20
    construction_scope = "trial"
    horizon = 1000
    reset = "full"
    root_seed = 0xc739
    streams = ["topology", "node_state", "world", "body", "task", "mechanism"]
    trials_per_block = 1
    warmup = 800

    [targets.interaction_cycle]
    kind = "reservoir_default"

    [targets.parameters]
    input_weight = 0.75
    leak = 0.25
    learn_on = true
    link_p = 0.1
    lrate_targ = 0.01
    lrate_wmat = 1.0
    rectify = false
    repair_masks = false
    targ_min = 1.0
    threshold_mult = 2.0
    topology = "bernoulli"
    weight_init_mode = "excitatory"
    weight_init_std = 1.0

    [targets.task_options]
[[targets]]
composition_id = "pong_falandays"
id = "pong_falandays"
n_nodes = 500
node = "falandays"
task = "pong"

    [targets.body_options]

    [targets.evaluation]
    aggregate = "mean"
    blocks = 20
    construction_scope = "trial"
    horizon = 2000
    reset = "full"
    root_seed = 0xcb21
    streams = ["topology", "node_state", "world", "body", "task", "mechanism"]
    trials_per_block = 1
    warmup = 1000

    [targets.interaction_cycle]
    kind = "reservoir_default"

    [targets.parameters]
    input_weight = 2.75
    leak = 0.25
    learn_on = true
    link_p = 0.1
    lrate_targ = 0.1
    lrate_wmat = 1.0
    rectify = false
    repair_masks = false
    targ_min = 1.0
    threshold_mult = 2.0
    topology = "bernoulli"
    weight_init_mode = "pong_mixed"
    weight_init_std = 1.0

    [targets.task_options]
