format = "brainlesslab-plan"
format_version = 3
id = "delayed_cue_performance_pilot"
operation = "benchmark"

[[benchmark.cases]]
baseline = "falandays_direct_v1__cue_pilot"
conditions = ["falandays_direct_v1__cue_pilot", "sorn_direct_v1__cue_pilot"]
id = "delayed_cue"

[[targets]]
id = "falandays_direct_v1__cue_pilot"
topology_key = "falandays_direct_v1"

    [targets.composition]
    id = "delayed_cue__falandays_direct_v1"
    n_nodes = 200
    node = "falandays"
    task = "delayed_cue"

        [targets.composition.interface]
        input_gain = 0.125

        [targets.composition.parameters]
        input_weight = 1.875
        leak = 0.25
        learn_on = true
        link_p = 0.1
        lrate_targ = 0.01
        lrate_wmat = 1.0
        rectify = false
        repair_masks = false
        targ_min = 1.0
        threshold_mult = 2.0
        topology = "bernoulli"
        weight_init_mode = "excitatory"
        weight_init_std = 1.0

    [targets.evaluation]
    aggregate = "mean"
    blocks = 256
    construction_scope = "trial"
    horizon = 144
    reset = "full"
    root_seed = 0x0e6399
    streams = ["topology", "world"]
    trials_per_block = 1
    warmup = 0
[[targets]]
id = "sorn_direct_v1__cue_pilot"
topology_key = "sorn_direct_v1"

    [targets.composition]
    id = "delayed_cue__sorn_direct_v1"
    n_nodes = 200
    node = "sorn"
    task = "delayed_cue"

        [targets.composition.interface]
        input_gain = 1.0

        [targets.composition.parameters]
        H_ip = 0.1
        T_E_max = 0.5
        T_I_max = 1.0
        ee_row_sum = 1.0
        ei_row_sum = 1.0
        eta_ip = 0.001
        eta_stdp = 0.001
        ie_row_sum = 1.0
        inhibitory_fraction = 0.2
        input_row_sum = 1.0
        learn_on = true
        p_ee = 0.060240963855421686
        p_ei = 1.0
        p_ie = 1.0
        p_input = 0.05
        p_output = 0.05

    [targets.evaluation]
    aggregate = "mean"
    blocks = 256
    construction_scope = "trial"
    horizon = 144
    reset = "full"
    root_seed = 0x0e6399
    streams = ["topology", "world"]
    trials_per_block = 1
    warmup = 0
