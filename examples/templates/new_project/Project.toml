# A script environment, not a package: run.jl, my_node.jl, my_task.jl and
# my_metric.jl are included directly (`julia --project=. run.jl`). Declaring
# name/uuid/version here made Julia treat it as a package and look for
# src/BrainlessLabNewProject.jl, so Pkg.precompile() failed with
# "Missing source file for ... BrainlessLabNewProject".

[deps]
BrainlessLab = "d12add44-1e3e-4161-9a99-c2121a2f0f38"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"

[compat]
BrainlessLab = "0.3"
CairoMakie = "0.12, 0.13, 0.14, 0.15"
Random = "1.11"
julia = "1.11"
